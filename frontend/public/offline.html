<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Offline — PESimens</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #ffffff;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      text-align: center;
      max-width: 420px;
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      object-fit: cover;
      margin-bottom: 24px;
    }

    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      color: #1e40af;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1e40af;
      margin-bottom: 8px;
    }

    p {
      font-size: 15px;
      line-height: 1.5;
      color: #64748b;
      margin-bottom: 24px;
    }

    button {
      background-color: #1e40af;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background-color: #1e3a8a;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/app-logo.jpeg" alt="PESimens" class="logo" />

    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M3 3l18 18M8.5 16.5a5 5 0 016.6-.3M5.5 12a10 10 0 013-2.1M12 19h.01M18.5 12a9.96 9.96 0 00-1.7-1.9M2 8.5a15 15 0 013.6-2.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <h1>You're offline</h1>
    <p>
      It looks like you've lost your internet connection. Some pages you've
      already visited may still be available — check the menu, or reconnect
      and try again.
    </p>

    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
